site_name: Nell Gram
site_url: https://nellcgram.github.io/
use_directory_urls: false
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - md_in_html
nav:
  - About: index.md
  - Writing Samples:
    - Help Center Article: writing-samples/help-article.md
    - KB Article: writing-samples/kb-article.md
    - Release Notes: writing-samples/release-notes.md
    - EOB Guide: writing-samples/eob-guide.md
  - Agentic Projects:
    - Docs Assistant Skills: agentic-projects/docs-assistant.md
    - Blind Occupation Reader: agentic-projects/occupation-reader.md
    - Book Recommendations Skill: agentic-projects/book-recommendations.md
  - How I build this site: how-I-build-this-site.md
