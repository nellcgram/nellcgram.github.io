name: CI

on:
  pull_request:
    branches:
      - main
    # `closed` lets pr-preview-action delete the preview when a PR is merged
    # or closed. The default event types leave it out.
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.event.action != 'closed'
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with MkDocs (fails on warnings)
        run: mkdocs build --strict

  lint:
    if: github.event.action != 'closed'
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: 'docs/**/*.md'

  linkcheck:
    if: github.event.action != 'closed'
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --config .lychee.toml
            docs/**/*.md
          fail: true

  preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        if: github.event.action != 'closed'
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pip install -r requirements.txt

      - name: Build site
        if: github.event.action != 'closed'
        run: mkdocs build --strict

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
