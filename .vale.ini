# Vale prose linter. Run from the repo root: vale docs
# `vale sync` downloads the Google package into .vale/styles/Google (git-ignored).
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google

[*.md]
BasedOnStyles = Google, NellStyle

# NellStyle replaces these Google rules, so each issue is reported once.
Google.Headings = NO
Google.Acronyms = NO

# This site is first-person writing, so the Google first-person rule is off.
Google.FirstPerson = NO

# Google's error-level rules would fail CI on any edited line that has a spaced
# em dash or a numeral like "7th". Keep them as warnings so only NellStyle's
# error rules (product names, placeholders) can block a pull request.
Google.EmDash = warning
Google.Ordinal = warning

# Exception: the EOB guide keeps title-case headings.
[docs/writing-samples/eob-guide.md]
NellStyle.HeadingCase = NO

# Exception: portfolio pieces keep their published wording. Google's style
# rules are off here; NellStyle still runs so product-name and placeholder
# errors are caught.
[docs/writing-samples/*.md]
BasedOnStyles = NellStyle
Google.EmDash = NO
Google.Ordinal = NO
NellStyle.HeadingCase = NO
NellStyle.SentenceLength = NO
NellStyle.InflatedWords = NO

[docs/agentic-projects/docs-assistant.md]
BasedOnStyles = NellStyle
Google.EmDash = NO
Google.Ordinal = NO
NellStyle.HeadingCase = NO
NellStyle.SentenceLength = NO
